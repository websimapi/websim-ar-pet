<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Pet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-gps.js"></script>
    <script src="main.js" type="module"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="status-container">
        <p id="status">Waiting for permissions and GPS signal...</p>
    </div>

    <!-- The AR scene -->
    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true;"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
        >

        <!-- The camera entity, which will move with the user's device -->
        <a-camera gps-camera rotation-reader></a-camera>

        <!-- Our voxel pet (a box for now) -->
        <a-box
            id="pet"
            material="color: tomato"
            scale="2 2 2"
            visible="false"
            pet-manager>
        </a-box>

    </a-scene>

</body>
</html>
